spring:
  application:
    name: clinica-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clinica}
    username: ${DB_USER:clinica}
    password: ${DB_PASSWORD:clinica}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:troque-este-segredo-por-um-valor-com-no-minimo-32-caracteres}
    expiracao-minutos: ${JWT_EXPIRACAO_MINUTOS:60}
  admin:
    email: ${ADMIN_EMAIL:admin@clinica.com}
    senha: ${ADMIN_PASSWORD:Admin@123}

management:
  endpoints:
    web:
      exposure:
        include: health,info
